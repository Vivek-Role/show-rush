# Phase 9 M3 — the local load balancer.
#
# LOCAL ONLY. This exists so that "two instances stay correct" can be verified
# and measured on one machine. It is not deployment infrastructure and
# render.yaml is deliberately untouched: the deployed service is still a single
# instance, and merging or deploying remain separate, unmade decisions.
#
# NO STICKY SESSIONS, and that is the interesting part rather than an oversight.
# The seat socket is server-to-client only and its show is fixed at upgrade
# time, so a connection carries no state an instance could own. Any instance can
# serve any client, and round-robin is therefore correct rather than merely
# tolerable.

events {
  worker_connections 4096;
}

http {
  # Round-robin across the instances. Named for what it balances, not for how.
  upstream showrush {
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  # A WebSocket upgrade is a hop-by-hop negotiation: 'upgrade' must be forwarded
  # when the client asked for one and must NOT be sent as a stale header on an
  # ordinary request, which is what this map arranges.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    # The hub's only same-origin check reads the Origin header (CORS does not
    # apply to WebSocket upgrades), so it has to survive the proxy intact — a
    # wrong-origin upgrade must still be refused with 403 through the balancer.
    proxy_set_header Origin            $http_origin;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Phase 9 M2 mints a request id when the caller does not supply one, and
    # honours a well-formed inbound one. Forwarding it is what lets a single
    # request be followed from here to whichever instance served it.
    proxy_set_header X-Request-Id      $http_x_request_id;

    location / {
      proxy_pass http://showrush;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # A seat socket is idle for long stretches — the hub pings every 30 s, and
      # a default 60 s read timeout would cut connections that are perfectly
      # healthy. Comfortably past the heartbeat.
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }
  }
}
