services:
  - type: web
    name: show-rush
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Pinned to match .nvmrc and package.json engines.
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      # DATABASE_URL and REDIS_URL are set in Module 0.6, in the Render
      # dashboard — never committed. See .env.example for their shapes.
