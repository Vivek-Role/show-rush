services:
  postgres:
    image: postgres:17-alpine
    container_name: showrush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: showrush
      POSTGRES_PASSWORD: showrush
      POSTGRES_DB: showrush
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showrush -d showrush"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: showrush-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
